name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 台灣 00:10（16:10 UTC）：抓「台灣的昨天」那張 APOD 重新部署，
    # 使用者在台灣午夜後看到的就是新圖
    - cron: '10 16 * * *'

# GITHUB_TOKEN 只給部署 Pages 需要的最小權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；排隊中的舊 run 直接取消，但不中斷進行中的那個
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 抓當日 APOD＋亮度分析，產出 public/apod.{json,jpg} 讓 build 帶走。
      # 失敗只會 console.warn，不會弄掛部署（前端有 client 端備援路徑）
      - run: node scripts/fetch-apod.mjs
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}

      # 用 client 端備援時才需要 VITE_ 這把 key；正常情況前端根本不打 NASA API
      - run: npm run build
        env:
          VITE_NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          # 卡片設定同步的中轉站網址（worker/ 那支 Worker 部署後的網址）。
          # 不是機密，用 repository variable 就好；沒設的話同步功能顯示成「尚未設定」
          VITE_SYNC_API: ${{ vars.SYNC_API }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
